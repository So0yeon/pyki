<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pyki · 파이썬 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF; --card:#FBFBF9; --ink:#16211D; --dim:#6B7872; --faint:#9AA6A0;
  --line:#DDE2DB; --line-2:#C7CFC7;
  --jade:#2E7A64; --jade-soft:#E4EEE9; --jade-deep:#1D5747;
  --orb:#A8730F; --orb-soft:#F4EBDA;
  --wrong:#A83A32; --wrong-soft:#F6E7E5;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif:"Gowun Batang",serif;
  --sans:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.7; letter-spacing:-.01em;
  padding:0 0 4rem;
}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.88em;background:var(--jade-soft);padding:1px 5px;border-radius:3px;color:var(--jade-deep)}

/* ── 상단 ── */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 8px}
.brand{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:.06em;line-height:1}
.brand span{color:var(--jade)}
.top-meta{font-size:12.5px;color:var(--faint);letter-spacing:.02em}

/* ── 생물 ── */
.creature{display:block;margin:0 auto;width:210px;height:170px}
.cr-line{fill:none;stroke:var(--jade);stroke-linecap:round;stroke-linejoin:round}
.cr-thin{fill:none;stroke:var(--jade);stroke-width:2;stroke-linecap:round}
.cr-dot{fill:var(--jade)}
.cr-orb{fill:var(--orb)}
.cr-eye{fill:var(--paper)}

/* ── 신분 ── */
.ident{text-align:center;margin:2px 0 26px}
.ident .rank{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:.04em;line-height:1.25}
.ident .molt{font-size:13px;color:var(--dim);margin-top:2px;letter-spacing:.02em}

/* ── 진행 레일 ── */
.rails{display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.rail{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:11px}
.rail-k{font-size:12.5px;color:var(--dim);font-family:var(--serif);letter-spacing:.08em}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.rail.orb .bar i{background:var(--orb)}
.rail-v{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.start{text-align:center}
.start .lead{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.02em}
.start .sub{font-size:13.5px;color:var(--dim);margin-top:5px}
.btn-main{
  display:block;width:100%;margin-top:18px;padding:14px;
  background:var(--jade);color:#fff;border:none;border-radius:10px;
  font-size:16px;font-weight:600;letter-spacing:.06em;transition:background .15s
}
.btn-main:hover{background:var(--jade-deep)}
.btn-main:disabled{background:var(--line-2);cursor:default}

/* ── 하단 탭 ── */
.tabs{display:flex;gap:8px;margin-top:14px}
.tabs button{
  flex:1;padding:11px;background:transparent;border:1px solid var(--line);
  border-radius:10px;color:var(--dim);font-size:14px;transition:.15s
}
.tabs button:hover{border-color:var(--line-2);color:var(--ink)}

/* ── 문제 화면 ── */
.qhead{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px}
.pips{display:flex;gap:5px}
.pip{width:22px;height:3px;border-radius:99px;background:var(--line)}
.pip.done{background:var(--jade)}
.pip.miss{background:var(--wrong)}
.pip.now{background:var(--ink)}
.qexit{background:none;border:none;color:var(--faint);font-size:13px;padding:4px}

.tagrow{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--jade-soft);color:var(--jade-deep);letter-spacing:.02em}
.tag.o{background:var(--orb-soft);color:var(--orb)}
.tag.n{background:var(--line);color:var(--dim)}

.qtext{font-size:17px;line-height:1.65;margin:0 0 16px;letter-spacing:-.005em}

pre.code{
  font-family:var(--mono);font-size:13.5px;line-height:1.85;
  background:#1B2622;color:#DDE6E1;padding:15px 16px;border-radius:10px;
  overflow-x:auto;margin:0 0 16px;white-space:pre;tab-size:4
}
pre.code .cm{color:#7C9188}
pre.code .st{color:#B7D8A8}
pre.code .kw{color:#8FC9E8}
pre.code .nb{color:#E8CB8F}
.blank-in{
  font-family:var(--mono);font-size:13.5px;background:#2C3B35;color:#FFF;
  border:1px solid #4A5F57;border-radius:5px;padding:2px 7px;min-width:88px;
  outline:none;transition:border-color .15s
}
.blank-in:focus{border-color:var(--jade)}
.blank-in.ok{border-color:#6FBF9D;background:#26483A}
.blank-in.no{border-color:#C4685F;background:#452B29}

/* 표 */
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 16px;font-family:var(--mono)}
.dtable th{background:var(--jade-soft);color:var(--jade-deep);font-weight:500;padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
.dtable td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--dim)}
.dtable tr:last-child td{border-bottom:none}

/* 선택지 */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{
  text-align:left;padding:12px 15px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-size:15px;transition:.13s;display:flex;gap:10px;align-items:flex-start
}
.opt:hover:not(:disabled){border-color:var(--jade);background:var(--jade-soft)}
.opt:disabled{cursor:default}
.opt .mk{color:var(--faint);font-family:var(--mono);font-size:13px;flex-shrink:0;padding-top:1px}
.opt.pick{border-color:var(--ink);background:#EDEFEA}
.opt.right{border-color:var(--jade);background:var(--jade-soft)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}

/* 차트 매칭 */
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.chbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;transition:.13s}
.chbox:hover:not(:disabled){border-color:var(--jade)}
.chbox svg{display:block;width:100%;height:88px}
.chbox .mk{font-size:12px;color:var(--faint);font-family:var(--mono);text-align:left;margin-top:4px}
.chbox.right{border-color:var(--jade);background:var(--jade-soft)}
.chbox.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.ch-ax{stroke:var(--line-2);stroke-width:1.5;fill:none}
.ch-mk{stroke:var(--jade);stroke-width:2;fill:none}
.ch-fl{fill:var(--jade)}

/* 순서 맞추기 */
.pool,.slot{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.slot{min-height:44px;padding:9px;border:1px dashed var(--line-2);border-radius:10px;background:#EFF1EC}
.slot.empty::before{content:"여기에 순서대로 쌓인다";font-size:13px;color:var(--faint);font-family:var(--sans)}
.ln{
  font-family:var(--mono);font-size:13px;text-align:left;padding:9px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);white-space:pre;overflow-x:auto;transition:.13s
}
.ln:hover:not(:disabled){border-color:var(--jade)}
.ln.right{border-color:var(--jade);background:var(--jade-soft)}
.ln.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.slot .ln{background:#fff}
.poolhead{font-size:12.5px;color:var(--faint);margin:0 0 7px;letter-spacing:.02em}

/* 자유 작성 */
textarea.write{
  width:100%;font-family:var(--mono);font-size:13.5px;line-height:1.8;
  background:#1B2622;color:#DDE6E1;border:1px solid #33443D;border-radius:10px;
  padding:14px;min-height:130px;resize:vertical;outline:none;margin-bottom:14px
}
textarea.write:focus{border-color:var(--jade)}
input.oneline{
  width:100%;font-family:var(--mono);font-size:13.5px;
  background:#1B2622;color:#DDE6E1;border:1px solid #33443D;border-radius:9px;
  padding:12px 14px;outline:none;margin-bottom:14px
}
input.oneline:focus{border-color:var(--jade)}

/* 액션 */
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{
  padding:11px 17px;border-radius:9px;border:1px solid var(--line-2);
  background:transparent;color:var(--dim);font-size:14px;transition:.13s
}
.acts button:hover{color:var(--ink);border-color:var(--ink)}
.acts .go{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500;flex:1}
.acts .go:hover{background:#000;color:#fff}
.err{color:var(--wrong);font-size:13.5px;margin:0 0 10px}

/* 힌트 */
.hint{
  border-left:2px solid var(--jade);background:var(--jade-soft);
  padding:13px 15px;margin:12px 0;border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.65
}
.hint b{display:block;font-size:11.5px;color:var(--jade);letter-spacing:.1em;margin-bottom:4px;font-weight:500}

/* 판정 */
.verdict{display:flex;align-items:center;gap:9px;margin:18px 0 14px;font-family:var(--serif);font-size:20px;font-weight:700}
.verdict.y{color:var(--jade)}
.verdict.n{color:var(--wrong)}
.verdict small{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--faint);letter-spacing:0}

/* 해설 */
.explain{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
.ex-b{margin-bottom:16px}
.ex-b h4{
  font-family:var(--serif);font-size:14px;font-weight:700;margin:0 0 5px;
  color:var(--jade-deep);letter-spacing:.05em
}
.ex-b p{margin:0;font-size:14.8px;line-height:1.78;color:#2B3A34}
.oneline{
  font-family:var(--serif);font-size:15.5px;font-weight:700;line-height:1.6;
  background:var(--jade-soft);border-radius:10px;padding:14px 16px;margin-top:4px;color:var(--jade-deep)
}
.model{margin-bottom:14px}
.model .lbl{font-size:12.5px;color:var(--faint);margin-bottom:6px;letter-spacing:.02em}
.checks{list-style:none;padding:0;margin:0 0 16px}
.checks li{
  font-size:14.5px;color:var(--dim);padding:7px 0 7px 24px;position:relative;border-bottom:1px solid var(--line)
}
.checks li:last-child{border-bottom:none}
.checks li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border:1.5px solid var(--line-2);border-radius:2px}

/* 결과 */
.done-h{text-align:center;padding:8px 0 22px}
.done-h .t{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:.03em}
.done-h .s{font-size:14px;color:var(--dim);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 10px;text-align:center}
.stat .n{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.2}
.stat .l{font-size:11.5px;color:var(--faint);margin-top:2px}
.recap{margin-bottom:16px}
.recap-i{
  display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px
}
.recap-i:last-child{border-bottom:none}
.recap-i .dot{width:6px;height:6px;border-radius:99px;margin-top:8px;flex-shrink:0;background:var(--jade)}
.recap-i.n .dot{background:var(--wrong)}
.recap-i .tx{color:var(--dim);line-height:1.55}
.recap-i .tx b{color:var(--ink);font-weight:500;display:block}

/* 승급 */
.molting{text-align:center;padding:34px 0}
.molting .k{font-size:12.5px;color:var(--jade);letter-spacing:.22em;margin-bottom:12px}
.molting .from{font-family:var(--serif);font-size:17px;color:var(--faint)}
.molting .to{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:.06em;margin:2px 0 14px;color:var(--jade-deep)}
.molting p{font-size:14.5px;color:var(--dim);max-width:330px;margin:0 auto 22px;line-height:1.7}

/* 꾸러미 */
.sect-h{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.03em;margin:26px 0 4px}
.sect-d{font-size:13.5px;color:var(--dim);margin:0 0 14px;line-height:1.6}
.bundles{display:flex;flex-direction:column;gap:9px}
.bun{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:14px 16px;transition:.13s
}
.bun:hover{border-color:var(--jade)}
.bun.dim{opacity:.5}
.bun .n{font-size:15.5px;font-weight:500;color:var(--ink)}
.bun .m{font-size:12.5px;color:var(--faint);margin-top:3px;letter-spacing:.01em}
.bun .m .lock{color:var(--orb)}

/* 기록 */
.krow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.krow:last-child{border-bottom:none}
.krow .k{color:var(--dim)}
.krow .v{font-family:var(--serif);font-size:17px;font-weight:700}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:30px 0}
.back{background:none;border:none;color:var(--dim);font-size:14px;padding:18px 0 6px}
.note{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:18px;text-align:center}
@media(max-width:400px){ .stats{grid-template-columns:1fr 1fr} .chgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Py<span>ki</span></div>
    <div class="top-meta" id="topMeta"></div>
  </div>
  <div id="app"></div>
</div>
<script>
const BANK = [
/* ===== Lv.1 알 : print, 변수, 자료형 ===== */
{
  id:"b101", track:"body", level:1, topic:"print",
  type:"blank",
  prompt:"화면에 <code>Hello, World!</code> 를 찍어보자. 빈칸을 채워라.",
  code:'____("Hello, World!")',
  answers:[["print"]],
  hint1:"파이썬에게 \"이걸 화면에 보여줘\"라고 시키는 명령이다. 영어로 '인쇄하다'.",
  hint2:"소문자 다섯 글자. p로 시작한다.",
  explain:{
    origin:"print는 '인쇄하다'라는 뜻이다. 화면이 없고 종이에 결과를 찍던 시절에 붙은 이름이 그대로 남았다. 지금은 종이가 아니라 화면에 찍지만 이름은 안 바뀌었다.",
    picture:"괄호는 '이걸 건네준다'는 표시다. print에게 문자열을 손에 쥐여주면 그걸 화면에 옮겨 적는다. 괄호 안에 넣은 것만 나온다.",
    trap:"따옴표를 빼면 파이썬은 Hello를 '변수 이름'으로 착각하고 그런 이름 없다며 에러를 낸다. 글자 그대로 보여주고 싶으면 반드시 따옴표로 감싼다.",
    oneline:"print(...) → 괄호 안에 넣은 것을 화면에 찍는다."
  }
},
{
  id:"b102", track:"body", level:1, topic:"print",
  type:"predict",
  prompt:"이 코드를 실행하면 무엇이 나올까?",
  code:'print("3 + 4")',
  choices:['7','3 + 4','"3 + 4"','에러가 난다'],
  correct:1,
  hint1:"따옴표 안에 들어간 것은 계산의 대상이 아니라 그냥 글자다.",
  hint2:"파이썬은 따옴표 안을 들여다보지 않는다. 있는 그대로 옮긴다.",
  explain:{
    origin:"따옴표로 감싼 글자 덩어리를 문자열(string)이라고 한다. string은 '실에 꿴 것'이라는 뜻인데, 글자들이 구슬처럼 한 줄로 꿰어져 있다는 그림에서 왔다.",
    picture:"따옴표는 봉투다. 봉투에 넣어 건네면 파이썬은 내용물을 열어보지 않고 그대로 전달한다. 봉투 없이 3 + 4를 건네면 그제야 계산기를 꺼낸다.",
    trap:"print(3 + 4)는 7이 나오고 print(\"3 + 4\")는 3 + 4가 나온다. 따옴표 하나 차이로 계산이 될지 안 될지가 갈린다.",
    oneline:"따옴표 안은 계산하지 않는다. 글자 그대로다."
  }
},
{
  id:"b103", track:"body", level:1, topic:"변수",
  type:"blank",
  prompt:"이름을 담은 변수를 만들고 출력한다. 빈칸을 채워라.",
  code:'name ____ "파이키"\nprint(name)',
  answers:[["="]],
  hint1:"오른쪽에 있는 값을 왼쪽 이름표에 붙이는 기호다.",
  hint2:"기호 하나다. 수학에서 '같다'로 쓰는 그것.",
  explain:{
    origin:"이 = 는 '같다'가 아니라 '넣는다'는 뜻이다. 그래서 읽을 때도 '네임은 파이키와 같다'가 아니라 '네임에 파이키를 넣는다'로 읽는 게 맞다.",
    picture:"변수는 상자가 아니라 이름표에 가깝다. 값에 이름표를 붙여두는 것이고, 나중에 그 이름을 부르면 붙여둔 값이 나온다. 화살표가 오른쪽에서 왼쪽으로 간다고 생각하면 된다.",
    trap:"방향을 바꿔서 \"파이키\" = name 이라고 쓰면 에러다. 이름표를 값에 붙여야지, 값을 이름표에 붙일 수는 없다. 왼쪽은 항상 이름 자리다.",
    oneline:"= 는 '같다'가 아니라 '왼쪽 이름에 오른쪽 값을 넣는다'."
  }
},
{
  id:"b104", track:"body", level:1, topic:"자료형",
  type:"predict",
  prompt:"이 코드의 결과는?",
  code:'a = "3"\nb = "4"\nprint(a + b)',
  choices:['7','34','3 + 4','에러가 난다'],
  correct:1,
  hint1:"a와 b는 숫자가 아니라 따옴표에 싸인 글자다.",

      const th=tMax*i/200, r=r0+(r1-r0)*(i/200);

      d += (i?" L":"M")+x.toFixed(1)+" "+y.toFixed(1);

    // 머리
    const nx=hx+Math.cos(ha+Math.PI/2)*hr*0.9, ny=hy+Math.sin(ha+Math.PI/2)*hr*0.9;
    A.push('<circle cx="'+nx.toFixed(1)+'" cy="'+ny.toFixed(1)+'" r="'+hr+'" class="cr-dot"/>');
    A.push('<circle cx="'+(nx+hr*0.32).toFixed(1)+'" cy="'+(ny-hr*0.28).toFixed(1)+'" r="'+(hr*0.2).toFixed(1)+'" class="cr-eye"/>');
    // 무늬
    if(l>=3){
      for(let i=3;i<9;i++){
        const th=tMax*(i/10), r=r0+(r1-r0)*(i/10);
        A.push('<circle cx="'+(cx+r*Math.cos(th-Math.PI/2)).toFixed(1)+'" cy="'+(cy+r*Math.sin(th-Math.PI/2)).toFixed(1)+'" r="1.8" class="cr-eye"/>');
      }
    }
    // 뿔 · 수염
    if(l>=5){
      A.push('<path d="M'+(nx-2)+' '+(ny-hr)+' l-6 -13 M'+(nx+5)+' '+(ny-hr+1)+' l4 -14" class="cr-thin"/>');
      A.push('<path d="M'+(nx+hr-1)+' '+(ny+2)+' q16 4 22 -6 M'+(nx+hr-2)+' '+(ny+7)+' q14 10 24 6" class="cr-thin"/>');
    }
    // 여의주
    if(l>=6){
      A.push('<circle cx="'+(nx+30)+'" cy="'+(ny-24)+'" r="9" class="cr-orb"/>');
      A.push('<circle cx="'+(nx+27)+'" cy="'+(ny-27)+'" r="2.6" class="cr-eye"/>');
    }
  }
  return '<svg class="creature" viewBox="0 0 210 170" role="img" aria-label="'+LV.body[l].n+'">'+A.join("")+'</svg>';
}

/* ─────────── 코드 색칠 ─────────── */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(src){
  let s=esc(src);
  s=s.replace(/(#[^\n]*)/g,'<span class="cm">$1</span>');
  s=s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="st">$1</span>');
  s=s.replace(/\b(def|return|for|in|if|elif|else|while|import|as|and|or|not|True|False|None)\b/g,'<span class="kw">$1</span>');
  s=s.replace(/\b(print|range|len|sum|int|str|float|append|get|items|sorted)\b(?=\()/g,'<span class="nb">$1</span>');
  return s;
}
function codeBlock(src){ return '<pre class="code">'+hl(src)+'</pre>'; }
function tableBlock(t){
  if(!t) return "";
  let h='<table class="dtable"><thead><tr>'+t.cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>';
  t.rows.forEach(r=>{ h+='<tr>'+r.map(c=>'<td>'+esc(String(c))+'</td>').join("")+'</tr>'; });
  return h+'</tbody></table>';
}

/* ─────────── 미니 차트 ─────────── */
function miniChart(kind){
  const w=150,h=88,x0=22,y0=70,x1=138,y1=14;
  let b='<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" class="ch-ax"/><line x1="'+x0+'" y1="'+y0+'" x2="'+x0+'" y2="'+y1+'" class="ch-ax"/>';
  if(kind==="line"){
    b+='<polyline points="32,58 54,44 76,50 98,26 120,20" class="ch-mk"/>';
    [[32,58],[54,44],[76,50],[98,26],[120,20]].forEach(p=>b+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4" class="ch-fl"/>');
  } else if(kind==="bar"){
    [[32,30],[57,48],[82,22],[107,40]].forEach(p=>b+='<rect x="'+p[0]+'" y="'+(y0-p[1])+'" width="17" height="'+p[1]+'" class="ch-fl"/>');
  } else if(kind==="scatter"){
    [[36,60],[48,52],[58,56],[66,44],[76,48],[84,36],[94,40],[104,28],[112,32],[122,22],[70,38],[90,50]]
      .forEach(p=>b+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" class="ch-fl"/>');

  }
  return '<svg viewBox="0 0 '+w+' '+h+'">'+b+'</svg>';

/* ─────────── 답 비교 ─────────── */
function norm(s){
  return String(s).replace(/[\u2018\u2019`]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\s+/g," ").trim();
}
function tight(s){ return norm(s).replace(/\s/g,""); }
function match(user,list){
  const u=norm(user), ut=tight(user);
  return list.some(a=>norm(a)===u || tight(a)===ut);
}

/* ─────────── 세션 ─────────── */
let SES=null, VIEW="home";

function buildSession(n){
  n=n||5;
  const out=[], used={};
  const due=Object.keys(S.review).filter(id=>S.review[id].due<=S.sessions&&byId[id]);
  due.sort((a,b)=>S.review[a].due-S.review[b].due);
  due.slice(0,2).forEach(id=>{ out.push(byId[id]); used[id]=1; });

  const pick=(t,l,k)=>{
    const c=inLv(t,l).filter(q=>!S.solved[q.id]&&!used[q.id]);
    for(let i=0;i<k&&i<c.length;i++){ out.push(c[i]); used[c[i].id]=1; }
  };
  const bl=curLv("body");
  if(orbOpen()){
    const ol=curLv("orb");
    pick("body",bl,Math.max(1,n-out.length-2));
    pick("orb",ol,n-out.length);
  }
  pick("body",bl,n-out.length);
  if(out.length<n) pick("body",Math.min(MAXLV.body,bl+1),n-out.length);
  if(out.length<n && orbOpen()) pick("orb",Math.min(MAXLV.orb,curLv("orb")+1),n-out.length);
  if(out.length<n){
    const rest=BANK.filter(q=>!used[q.id]&&!S.solved[q.id]);
    rest.slice(0,n-out.length).forEach(q=>{out.push(q);used[q.id]=1;});
  }
  if(out.length<n){
    const rest=BANK.filter(q=>!used[q.id]);
    rest.sort(()=>Math.random()-0.5);
    rest.slice(0,n-out.length).forEach(q=>{out.push(q);used[q.id]=1;});
  }
  return out.slice(0,n);
}

function startSession(list,label){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastDay!==today){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = (S.lastDay===y)? S.streak+1 : 1;
    S.lastDay=today;
  }
  const before={body:curLv("body"),orb:curLv("orb")};
  SES={qs:list, i:0, res:[], label:label||"오늘의 다섯 문제", before:before, hint:0, done:false, picked:null, order:[], revealed:false};
  VIEW="q"; render();
}

const INTERVAL=[1,3,7];
function schedule(id,ok){
  const r=S.review[id];
  if(ok){
    if(!r) return;
    const st=(r.stage||0)+1;
    if(st>=INTERVAL.length) delete S.review[id];
    else S.review[id]={stage:st, due:S.sessions+INTERVAL[st]};
  } else {
    S.review[id]={stage:0, due:S.sessions+INTERVAL[0]};
  }
}

const topMeta=document.getElementById("topMeta");

function meta(){

  topMeta.textContent = t? (t+"문제 · "+S.streak+"일째") : "처음 오셨네요";
}

function paintOpts(){
  const q=SES.qs[SES.i], box=document.getElementById("opts"); if(!box) return;
  const marks=["A","B","C","D"];
  if(q.type==="match"){
    box.innerHTML=q.charts.map((c,i)=>
      '<button class="chbox" data-i="'+i+'"'+(SES.done?" disabled":"")+'>'+miniChart(c)+'<div class="mk">'+marks[i]+'</div></button>').join("");
  } else {
    box.innerHTML=q.choices.map((c,i)=>
      '<button class="opt" data-i="'+i+'"'+(SES.done?" disabled":"")+'><span class="mk">'+marks[i]+'</span><span>'+c+'</span></button>').join("");
  }
  [...box.children].forEach(b=>{
    const i=+b.dataset.i;
    if(SES.done){
      if(i===q.correct) b.classList.add("right");
      else if(i===SES.picked) b.classList.add("wrong");
    } else if(i===SES.picked) b.classList.add("pick");
    b.onclick=()=>{ if(SES.done)return; SES.picked=i; paintOpts(); hideErr(); };
  });
}

function accepted(q){ return q.accept || [q.lines.map((_,i)=>i)]; }
function orderOK(q,ord){
  return accepted(q).some(a=>ord.length===a.length && ord.every((ix,i)=>q.lines[ix]===q.lines[a[i]]));
}
function bestOrder(q,ord){
  let best=accepted(q)[0], top=-1;
  accepted(q).forEach(a=>{
    let sc=0; ord.forEach((ix,i)=>{ if(i<a.length && q.lines[ix]===q.lines[a[i]]) sc++; });
    if(sc>top){ top=sc; best=a; }
  });
  return best;
}
function paintOrder(){
  const q=SES.qs[SES.i]; if(q.type!=="order") return;
  const slot=document.getElementById("slot"), pool=document.getElementById("pool");
  if(!SES.shuffled) SES.shuffled=q.lines.map((l,i)=>i).sort(()=>Math.random()-0.5);
  slot.className="slot"+(SES.order.length?"":" empty");
  const ref=SES.done? bestOrder(q,SES.order) : null;
  slot.innerHTML=SES.order.map((ix,pos)=>{
    let cls="ln";
    if(SES.done) cls+= (pos<ref.length && q.lines[ix]===q.lines[ref[pos]])?" right":" wrong";
    return '<button class="'+cls+'" data-p="'+pos+'"'+(SES.done?" disabled":"")+'>'+esc(q.lines[ix]||"(빈 줄)")+'</button>';
  }).join("");
  pool.innerHTML=SES.shuffled.filter(ix=>!SES.order.includes(ix)).map(ix=>
    '<button class="ln" data-x="'+ix+'"'+(SES.done?" disabled":"")+'>'+esc(q.lines[ix]||"(빈 줄)")+'</button>').join("");
  [...pool.children].forEach(b=>b.onclick=()=>{ SES.order.push(+b.dataset.x); paintOrder(); hideErr(); });
  [...slot.children].forEach(b=>b.onclick=()=>{ SES.order.splice(+b.dataset.p,1); paintOrder(); });
}

function paintHints(){
  const q=SES.qs[SES.i], box=document.getElementById("hints"); let h="";
  if(SES.hint>=1) h+='<div class="hint"><b>힌트 하나 · 방향</b>'+q.hint1+'</div>';
  if(SES.hint>=2) h+='<div class="hint"><b>힌트 둘 · 구체</b>'+q.hint2+'</div>';
  box.innerHTML=h;
}

function showErr(m){ const e=document.getElementById("err"); e.textContent=m; e.style.display="block"; }
function hideErr(){ const e=document.getElementById("err"); if(e) e.style.display="none"; }

function paintActs(){
  const q=SES.qs[SES.i], box=document.getElementById("acts");
  if(SES.done){
    const last=SES.i===SES.qs.length-1;
    box.innerHTML='<button class="go" id="next">'+(last?"결과 보기":"다음 문제")+'</button>';
    document.getElementById("next").onclick=nextQ;
    return;
  }
  let h='<button class="go" id="chk">확인</button>';
  if(SES.hint<2) h+='<button id="hint">힌트 보기</button>';
  else h+='<button id="rev">정답 보기</button>';
  box.innerHTML=h;
  document.getElementById("chk").onclick=check;
  const hb=document.getElementById("hint");
  if(hb) hb.onclick=()=>{ SES.hint++; S.hintUse++; paintHints(); paintActs(); };
  const rb=document.getElementById("rev");
  if(rb) rb.onclick=()=>{ SES.revealed=true; S.reveal++; finish(false); };
}

/* 채점 */
function check(){
  const q=SES.qs[SES.i];
  if(q.type==="blank"){
    const ins=[...app.querySelectorAll(".blank-in")];
    if(ins.some(i=>!i.value.trim())) return showErr("빈칸을 채운 다음 확인하자.");
    const ok=ins.every((inp,i)=>match(inp.value,q.answers[i]));
    ins.forEach((inp,i)=>{ inp.classList.remove("ok","no"); inp.classList.add(match(inp.value,q.answers[i])?"ok":"no"); });
    finish(ok);
  }
  else if(q.type==="predict"||q.type==="match"){
    if(SES.picked===null) return showErr("답을 하나 고른 다음 확인하자.");
    finish(SES.picked===q.correct);
  }
  else if(q.type==="bug"){
    const v=document.getElementById("bugIn").value;
    if(!v.trim()) return showErr("고친 줄을 쓴 다음 확인하자.");
    finish(match(v,q.answers[0]));
  }
  else if(q.type==="order"){
    if(SES.order.length!==q.lines.length) return showErr("모든 줄을 순서대로 쌓은 다음 확인하자.");
    finish(orderOK(q,SES.order));
  }
  else if(q.type==="write"){
    const v=document.getElementById("wIn").value;
    if(!v.trim()) return showErr("코드를 작성한 다음 확인하자.");
    SES.selfPending=true; finish(null);
  }
}

function finish(ok){
  const q=SES.qs[SES.i];
  SES.done=true; S.tried++;
  if(ok===null){ paintOpts(); paintOrder(); afterView(null); return; }
  applyResult(ok);
  afterView(ok); paintOpts(); paintOrder(); paintActs();
}

function applyResult(ok){
  const q=SES.qs[SES.i];
  SES.res[SES.i]=ok;
  if(ok){
    if(!S.solved[q.id]) S.solved[q.id]=1;
    if(SES.hint===0 && !SES.revealed) S.noHint++;
    else schedule(q.id,false);
    if(S.review[q.id]&&SES.hint===0) schedule(q.id,true);
  } else {
    schedule(q.id,false);
  }
  save();
}

function afterView(ok){
  const q=SES.qs[SES.i], box=document.getElementById("after");
  let h="";
  if(ok===null){
    h+='<div class="explain"><div class="model"><div class="lbl">이렇게 쓸 수 있다</div>'+codeBlock(q.model)+'</div>';
    h+='<div class="lbl" style="font-size:12.5px;color:var(--faint);margin-bottom:6px">스스로 확인해보자</div><ul class="checks">';
    q.checks.forEach(c=>h+='<li>'+c+'</li>');
    h+='</ul><div class="acts"><button class="go" id="selfY">다 맞았다</button><button id="selfN">아직 아니다</button></div></div>';
    box.innerHTML=h;
    document.getElementById("selfY").onclick=()=>{ SES.selfPending=false; applyResult(true); box.innerHTML=explainHTML(q,true); paintActs(); };
    document.getElementById("selfN").onclick=()=>{ SES.selfPending=false; applyResult(false); box.innerHTML=explainHTML(q,false); paintActs(); };
    document.getElementById("acts").innerHTML="";
    return;
  }
  box.innerHTML=explainHTML(q,ok);
}

function explainHTML(q,ok){
  const e=q.explain;
  let h='<div class="verdict '+(ok?"y":"n")+'">'+(ok?"맞았다":"다시 보자")+
        (ok&&SES.hint===0&&!SES.revealed?' <small>힌트 없이</small>':'')+'</div>';
  if(!ok && q.type==="blank")
    h+='<div class="model"><div class="lbl">정답</div>'+codeBlock(q.code.split("____").map((p,i)=>p+(i<q.answers.length?q.answers[i][0]:"")).join(""))+'</div>';
  if(!ok && q.type==="bug")
    h+='<div class="model"><div class="lbl">정답</div>'+codeBlock(q.answers[0][0])+'</div>';
  if(!ok && q.type==="order"){
    const a=accepted(q)[0];
    h+='<div class="model"><div class="lbl">정답'+(accepted(q).length>1?' (다른 순서도 성립한다)':'')+'</div>'+
       codeBlock(a.map(i=>q.lines[i]).join("\n"))+'</div>';
  }
  if(!ok && (q.type==="predict"||q.type==="match"))
    h+='<div class="model"><div class="lbl">정답</div><p style="margin:0;font-size:15px">'+
       (q.type==="match"?["A","B","C","D"][q.correct]:q.choices[q.correct])+'</p></div>';

  h+='<div class="explain">';
  if(e.origin)  h+='<div class="ex-b"><h4>이름의 출처</h4><p>'+e.origin+'</p></div>';
  if(e.picture) h+='<div class="ex-b"><h4>동작의 그림</h4><p>'+e.picture+'</p></div>';
  if(e.trap)    h+='<div class="ex-b"><h4>흔한 함정</h4><p>'+e.trap+'</p></div>';
  h+='<div class="oneline">'+e.oneline+'</div></div>';
  return h;
}

function nextQ(){
  if(SES.i<SES.qs.length-1){
    SES.i++; SES.hint=0; SES.done=false; SES.picked=null; SES.order=[]; SES.shuffled=null; SES.revealed=false;
    render();
  } else {
    S.sessions++; save();
    const after={body:curLv("body"),orb:curLv("orb")};
    if(after.body>SES.before.body){ SES.moltTo=after.body; VIEW="molt"; }
    else VIEW="done";
    render();
  }
}

/* ═══════════ 승급 ═══════════ */
function moltView(){
  const to=SES.moltTo;
  let h=creature();
  h+='<div class="molting"><div class="k">탈 피</div>'+
     '<div class="from">'+LV.body[to-1].n+'</div>'+
     '<div class="to">'+LV.body[to].n+'</div>'+
     '<p>낡은 껍질을 벗었다. 이제 '+LV.body[to].d+'를 익힐 차례다.</p>'+
     '<button class="btn-main" id="ok" style="max-width:260px;margin:0 auto">계속</button></div>';
  app.innerHTML=h; meta();
  document.getElementById("ok").onclick=()=>{VIEW="done";render();};
}

/* ═══════════ 세션 결과 ═══════════ */
function doneView(){
  const n=SES.qs.length, right=SES.res.filter(r=>r===true).length;
  let h='<div class="done-h"><div class="t">'+(right===n?"모두 맞았다":right>=n/2?"수고했다":"천천히 가자")+'</div>'+
        '<div class="s">'+SES.label+'</div></div>';
  h+='<div class="stats">'+
     '<div class="stat"><div class="n">'+right+'/'+n+'</div><div class="l">이번 세션</div></div>'+
     '<div class="stat"><div class="n">'+totalSolved()+'</div><div class="l">누적 해결</div></div>'+
     '<div class="stat"><div class="n">'+S.streak+'</div><div class="l">연속 학습일</div></div></div>';

  h+='<div class="card recap">';
  SES.qs.forEach((q,i)=>{
    h+='<div class="recap-i'+(SES.res[i]?"":" n")+'"><div class="dot"></div><div class="tx"><b>'+q.topic+'</b>'+q.explain.oneline+'</div></div>';
  });
  h+='</div>';

  const dueN=Object.keys(S.review).length;
  if(dueN) h+='<p class="note">복습으로 넘긴 문제 '+dueN+'개는 다음 세션에 다시 나온다.</p>';

  h+='<div class="tabs"><button id="again">한 번 더</button><button id="home">돌아가기</button></div>';
  app.innerHTML=h; meta();
  document.getElementById("again").onclick=()=>startSession(buildSession(5));
  document.getElementById("home").onclick=()=>{VIEW="home";SES=null;render();};
}

/* ═══════════ 꾸러미 ═══════════ */
function bundlesView(){
  let h='<button class="back" id="bk">← 돌아가기</button>';
  ["주제","함정","실전"].forEach(g=>{
    const desc={
      "주제":"개념 하나를 집중해서 파고든다.",
      "함정":"실제로 자주 틀리는 자리만 모았다.",
      "실전":"하나의 상황을 여러 문제로 쪼갰다. 조각을 이어 붙이는 자리."
    }[g];
    h+='<div class="sect-h">'+g+' 꾸러미</div><p class="sect-d">'+desc+'</p><div class="bundles">';
    BUNDLES.filter(b=>b.g===g).forEach((b,i)=>{
      const done=b.ids.filter(id=>S.solved[id]).length;
      const soon=b.lv>curLv("body")&&b.lv>2;
      h+='<button class="bun'+(soon?" dim":"")+'" data-g="'+g+'" data-i="'+i+'">'+
         '<div class="n">'+b.n+'</div><div class="m">'+b.ids.length+'문제 · 약 '+Math.max(3,Math.round(b.ids.length*1.2))+'분'+
         (done?' · '+done+'개 해결':'')+
         (soon?' · <span class="lock">'+LV.body[b.lv].n+' 단계부터 권장</span>':'')+'</div></button>';
    });
    h+='</div>';
  });
  h+='<p class="note">잠긴 꾸러미는 없다. 아직 안 배운 개념이 섞였을 때만 흐리게 표시한다.</p>';
  app.innerHTML=h; meta();
  document.getElementById("bk").onclick=()=>{VIEW="home";render();};
  app.querySelectorAll(".bun").forEach(b=>{
    b.onclick=()=>{
      const g=b.dataset.g, i=+b.dataset.i;
      const bun=BUNDLES.filter(x=>x.g===g)[i];
      startSession(bun.ids.map(id=>byId[id]).filter(Boolean), bun.n);
    };
  });
}

/* ═══════════ 기록 ═══════════ */
function recordsView(){
  let h='<button class="back" id="bk">← 돌아가기</button>';
  h+='<div class="sect-h">지금까지</div><div class="card" style="margin-top:10px">';
  const acc=S.tried? Math.round(totalSolved()/S.tried*100):0;
  [["연속 학습일",S.streak+"일"],["푼 세션",S.sessions+"회"],["해결한 문제",totalSolved()+" / "+BANK.length],
   ["힌트 없이 맞힌 수",S.noHint+"개"],["정답을 열어본 수",S.reveal+"개"]].forEach(r=>{
    h+='<div class="krow"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>';
  });
  h+='</div>';

  h+='<div class="sect-h">단계</div><p class="sect-d">각 단계의 8할을 풀면 다음으로 넘어간다.</p><div class="card">';
  for(let l=1;l<=MAXLV.body;l++){
    const s=solvedIn("body",l), t=inLv("body",l).length;
    h+='<div class="krow"><div class="k">'+LV.body[l].n+' <span style="color:var(--faint);font-size:12.5px">'+LV.body[l].d+'</span></div><div class="v" style="font-size:14px">'+s+'/'+t+'</div></div>';
  }
  h+='</div>';
  if(orbOpen()){
    h+='<div class="sect-h">여의주</div><div class="card">';
    for(let l=1;l<=MAXLV.orb;l++){
      const s=solvedIn("orb",l), t=inLv("orb",l).length;
      h+='<div class="krow"><div class="k">'+LV.orb[l].n+' <span style="color:var(--faint);font-size:12.5px">'+LV.orb[l].d+'</span></div><div class="v" style="font-size:14px">'+s+'/'+t+'</div></div>';
    }
    h+='</div>';
  }

  const due=Object.keys(S.review).filter(id=>byId[id]);
  h+='<div class="sect-h">복습 대기</div>';
  if(!due.length) h+='<p class="empty">아직 복습할 문제가 없다.</p>';
  else{
    h+='<div class="card">';
    due.slice(0,12).forEach(id=>{
      h+='<div class="krow"><div class="k">'+byId[id].topic+' <span style="color:var(--faint);font-size:12.5px">'+byId[id].explain.oneline.slice(0,26)+'…</span></div><div class="v" style="font-size:13px;color:var(--faint)">'+(S.review[id].stage+1)+'차</div></div>';
    });
    h+='</div><div class="tabs" style="margin-top:12px"><button id="revNow">복습만 풀기</button></div>';
  }

  h+='<div class="tabs" style="margin-top:22px"><button id="reset" style="color:var(--faint)">기록 지우기</button></div>';
  app.innerHTML=h; meta();
  document.getElementById("bk").onclick=()=>{VIEW="home";render();};
  const rn=document.getElementById("revNow");
  if(rn) rn.onclick=()=>startSession(due.slice(0,5).map(id=>byId[id]),"복습 세션");
  document.getElementById("reset").onclick=()=>{
    if(confirm("모든 기록을 지운다. 되돌릴 수 없다.")){
      S={solved:{},review:{},sessions:0,noHint:0,hintUse:0,reveal:0,tried:0,streak:0,lastDay:null};
      save(); VIEW="home"; render();
    }
  };
}

/* ═══════════ 라우터 ═══════════ */
function render(){
  window.scrollTo(0,0);
  if(VIEW==="q")        qView();
  else if(VIEW==="done")  doneView();
  else if(VIEW==="molt")  moltView();
  else if(VIEW==="bundles")bundlesView();
  else if(VIEW==="records")recordsView();
  else homeView();
}
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&VIEW==="q"&&!e.shiftKey){
    const t=e.target.tagName;
    if(t==="INPUT"){ e.preventDefault(); const b=document.getElementById("chk")||document.getElementById("next"); if(b)b.click(); }
  }
});
render();

</script>
</body>
</html>
